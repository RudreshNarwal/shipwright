<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 624" width="720" height="624" role="img"
     aria-label="Shipwright pipeline: requirement → preflight → brainstorm → plan → build → review → QA → finalize → PR with proof, with a Phase-5 escalation loop back to plan/brainstorm.">
  <defs>
    <linearGradient id="sw-g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5A0"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <style>
      .t  { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .ti { font-weight: 700; font-size: 16px; fill: #0F172A; }
      .de { font-weight: 500; font-size: 11.5px; fill: #64748B; }
      .bn { font-weight: 700; font-size: 14px; fill: #FFFFFF; }
      .pill { font-weight: 700; font-size: 14px; }
      .esc { font-weight: 700; font-size: 12.5px; fill: #0E7490; }
      .escs{ font-weight: 500; font-size: 10.5px; fill: #64748B; }
    </style>
  </defs>

  <!-- self-contained panel (readable on light or dark themes) -->
  <rect x="3" y="3" width="714" height="618" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ===== connectors (vertical line + arrowhead triangle), cx = 254 ===== -->
  <g stroke="#CBD5E1" stroke-width="2">
    <line x1="254" y1="62"  x2="254" y2="79"/>
    <line x1="254" y1="138" x2="254" y2="149"/>
    <line x1="254" y1="208" x2="254" y2="219"/>
    <line x1="254" y1="278" x2="254" y2="289"/>
    <line x1="254" y1="348" x2="254" y2="359"/>
    <line x1="254" y1="418" x2="254" y2="429"/>
    <line x1="254" y1="488" x2="254" y2="499"/>
    <line x1="254" y1="558" x2="254" y2="569"/>
  </g>
  <g fill="#94A3B8">
    <polygon points="248,79 260,79 254,86"/>
    <polygon points="248,149 260,149 254,156"/>
    <polygon points="248,219 260,219 254,226"/>
    <polygon points="248,289 260,289 254,296"/>
    <polygon points="248,359 260,359 254,366"/>
    <polygon points="248,429 260,429 254,436"/>
    <polygon points="248,499 260,499 254,506"/>
    <polygon points="248,569 260,569 254,576"/>
  </g>

  <!-- ===== start pill: a requirement ===== -->
  <rect x="164" y="24" width="180" height="38" rx="19" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text class="t pill" x="254" y="48" text-anchor="middle" fill="#0F172A">a requirement</text>

  <!-- ===== phase cards ===== -->
  <!-- helper visual: each card is a rounded rect + gradient number badge + title + descriptor -->
  <!-- 0 Preflight -->
  <g>
    <rect x="44" y="86" width="420" height="52" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="56" y="98" width="30" height="30" rx="8" fill="url(#sw-g)"/>
    <text class="t bn" x="71" y="118" text-anchor="middle">0</text>
    <text class="t ti" x="100" y="110">Preflight</text>
    <text class="t de" x="100" y="127">verify gstack — superpowers · karpathy · frontend-design are bundled</text>
  </g>
  <!-- 1 Brainstorm -->
  <g>
    <rect x="44" y="156" width="420" height="52" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="56" y="168" width="30" height="30" rx="8" fill="url(#sw-g)"/>
    <text class="t bn" x="71" y="188" text-anchor="middle">1</text>
    <text class="t ti" x="100" y="180">Brainstorm</text>
    <text class="t de" x="100" y="197">→ approved spec · then the one autonomy gate (+ QA creds)</text>
  </g>
  <!-- 2 Plan -->
  <g>
    <rect x="44" y="226" width="420" height="52" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="56" y="238" width="30" height="30" rx="8" fill="url(#sw-g)"/>
    <text class="t bn" x="71" y="258" text-anchor="middle">2</text>
    <text class="t ti" x="100" y="250">Plan</text>
    <text class="t de" x="100" y="267">writing-plans (+ /autoplan review when autonomous)</text>
  </g>
  <!-- 3 Build -->
  <g>
    <rect x="44" y="296" width="420" height="52" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="56" y="308" width="30" height="30" rx="8" fill="url(#sw-g)"/>
    <text class="t bn" x="71" y="328" text-anchor="middle">3</text>
    <text class="t ti" x="100" y="320">Build</text>
    <text class="t de" x="100" y="337">subagent-driven · TDD per task · frontend-design for UI</text>
  </g>
  <!-- 4 Review -->
  <g>
    <rect x="44" y="366" width="420" height="52" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="56" y="378" width="30" height="30" rx="8" fill="url(#sw-g)"/>
    <text class="t bn" x="71" y="398" text-anchor="middle">4</text>
    <text class="t ti" x="100" y="390">Review</text>
    <text class="t de" x="100" y="407">requesting + receiving code review (+ /review, /codex)</text>
  </g>
  <!-- 5 QA -->
  <g>
    <rect x="44" y="436" width="420" height="52" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="56" y="448" width="30" height="30" rx="8" fill="url(#sw-g)"/>
    <text class="t bn" x="71" y="468" text-anchor="middle">5</text>
    <text class="t ti" x="100" y="460">QA — UI &amp; API</text>
    <text class="t de" x="100" y="477">browser /qa · network 2xx · console · design-review</text>
  </g>
  <!-- 6 Finalize -->
  <g>
    <rect x="44" y="506" width="420" height="52" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="56" y="518" width="30" height="30" rx="8" fill="url(#sw-g)"/>
    <text class="t bn" x="71" y="538" text-anchor="middle">6</text>
    <text class="t ti" x="100" y="530">Finalize + Ship</text>
    <text class="t de" x="100" y="547">report · screenshots · cost table · soft gate · /ship</text>
  </g>

  <!-- ===== end pill: PR with proof ===== -->
  <rect x="154" y="576" width="200" height="38" rx="19" fill="url(#sw-g)"/>
  <text class="t pill" x="254" y="600" text-anchor="middle" fill="#FFFFFF">PR with proof ✓</text>

  <!-- ===== Phase-5 escalation loop-back: QA → Plan / Brainstorm ===== -->
  <path d="M 464 462 C 560 462, 560 252, 474 252" fill="none" stroke="#0EA5A0" stroke-width="2"
        stroke-dasharray="6 5"/>
  <polygon points="474,246 474,258 464,252" fill="#0EA5A0"/>
  <text class="t esc"  x="572" y="334">escalation</text>
  <text class="t escs" x="572" y="351">re-plan · re-design</text>
  <text class="t escs" x="572" y="365">· re-scope</text>
  <text class="t escs" x="572" y="384">interactive: confirm</text>
  <text class="t escs" x="572" y="398">autonomous: auto</text>
  <text class="t escs" x="572" y="412">(scope change stops)</text>
</svg>
